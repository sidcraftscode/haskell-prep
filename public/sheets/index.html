<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haskell Sheet Revision</title>
<link href="fonts/fonts.css" rel="stylesheet">
<script>window.SHEETS_EMBED = window.parent !== window;</script>
<script>try { var t = JSON.parse(localStorage.getItem('haskell-sheets-v1') || '{}').theme; if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
<style>
/* Layout idea: a lab bench. Fixed top rail, sheet index on the left, question text beside the editor and its test results. */
:root {
  /* Palette and faces follow haskell-prep: ink, plum, orchid, mist, sun. */
  --bg: #f4f2f9;
  --surface: #ffffff;
  --sunk: #ebe7f4;
  --ink: #221c35;
  --muted: #4f4866;
  --faint: #8a84a0;
  --line: #ddd7eb;
  --accent: #5e5086;
  --accent-deep: #453a62;
  --orchid: #8f4e8b;
  --accent-ink: #ffffff;
  --accent-soft: #ebe7f4;
  --good: #1d7f67;
  --good-soft: #e2f3ed;
  --bad: #b93a47;
  --bad-soft: #fbe6e8;
  --warn: #c98d00;
  --warn-soft: #fbf1d6;
  --code-kw: #8f4e8b;
  --code-str: #1d7f67;
  --code-num: #9a6c00;
  --code-com: #8a84a0;
  --code-type: #453a62;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Avenir Next", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17132a; --surface: #211c38; --sunk: #2b2547; --ink: #ece8f7; --muted: #b9b2d0; --faint: #8a84a0; --line: #3b3458;
    --accent: #b6a8e0; --accent-deep: #d5ccf0; --orchid: #d79ad3; --accent-ink: #1b1630; --accent-soft: #2f2850;
    --good: #6fd0b5; --good-soft: #17322b; --bad: #f08a95; --bad-soft: #3b1a20; --warn: #e6b84f; --warn-soft: #3a2f12;
    --code-kw: #d79ad3; --code-str: #6fd0b5; --code-num: #e6b84f; --code-com: #8a84a0; --code-type: #cfc4f2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17132a; --surface: #211c38; --sunk: #2b2547; --ink: #ece8f7; --muted: #b9b2d0; --faint: #8a84a0; --line: #3b3458;
    --accent: #b6a8e0; --accent-deep: #d5ccf0; --orchid: #d79ad3; --accent-ink: #1b1630; --accent-soft: #2f2850;
    --good: #6fd0b5; --good-soft: #17322b; --bad: #f08a95; --bad-soft: #3b1a20; --warn: #e6b84f; --warn-soft: #3a2f12;
    --code-kw: #d79ad3; --code-str: #6fd0b5; --code-num: #e6b84f; --code-com: #8a84a0; --code-type: #cfc4f2;
    color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--font-body); -webkit-font-smoothing: antialiased; font-variant-ligatures: none; display: grid; grid-template-rows: auto auto minmax(0, 1fr); grid-template-columns: 290px minmax(0, 1fr); }
[hidden] { display: none !important; }
a { color: var(--accent); }
code, pre, kbd { font-family: var(--font-mono); font-size: 0.9em; }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.2; margin: 0; text-wrap: balance; }
:focus-visible { outline: 3px solid var(--orchid); outline-offset: 2px; }
.muted { color: var(--muted); }
.good { color: var(--good); } .bad { color: var(--bad); }

/* top rail */
.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--ink); text-decoration: none; display: flex; align-items: center; gap: 9px; }
.brand-mark { font-family: var(--font-mono); font-weight: 600; font-size: 14px; background: var(--orchid); color: var(--accent-ink); padding: 2px 7px; border-radius: 5px; }
.top-links { display: flex; gap: 4px; }
.host-back { font-size: 14px; font-weight: 700; color: var(--muted); text-decoration: none; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; white-space: nowrap; }
.host-back:hover { color: var(--ink); border-color: var(--ink); }
.top-links a { color: var(--muted); text-decoration: none; padding: 5px 10px; border-radius: 6px; font-weight: 500; }
.top-links a:hover { color: var(--ink); background: var(--sunk); }
.top-links a.current { color: var(--accent); background: var(--accent-soft); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.progress { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.progress .bar { width: 110px; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s; }
.chip { font-size: 12.5px; padding: 3px 9px; border-radius: 999px; background: var(--sunk); color: var(--ink); white-space: nowrap; }
.engine { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.engine::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.engine.ready::before { background: var(--good); } .engine.failed::before { background: var(--bad); }
.engine.loading::before { background: var(--warn); animation: pulse 1s infinite alternate; }
@keyframes pulse { from { opacity: .35; } to { opacity: 1; } }

/* mock bar */
.mockbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 8px 16px; background: var(--accent-soft); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.mock-label { font-family: var(--font-display); font-weight: 700; }
.mock-nav { display: flex; gap: 6px; flex-wrap: wrap; }
.mock-q { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; font-weight: 600; font-variant-numeric: tabular-nums; }
.mock-q.current { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.mock-q.good { background: var(--good-soft); color: var(--good); border-color: var(--good); }
.mock-q.part { border-style: dashed; border-color: var(--warn); }
.mock-clock { font-family: var(--font-mono); font-weight: 600; font-size: 18px; margin-left: auto; font-variant-numeric: tabular-nums; }
.mock-clock.low { color: var(--bad); }

/* sidebar */
.side { grid-row: 3; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); padding: 12px 10px 30px; }
.filters { display: flex; gap: 6px; padding: 0 4px 10px; }
.filters button { flex: 1; font: inherit; font-size: 12.5px; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.nav-sheet { margin-bottom: 4px; }
.nav-sheet summary { display: flex; align-items: center; gap: 8px; padding: 7px 6px; cursor: pointer; border-radius: 6px; list-style: none; font-weight: 600; }
.nav-sheet summary::-webkit-details-marker { display: none; }
.nav-sheet summary:hover { background: var(--sunk); }
.nav-sheet-n { font-family: var(--font-mono); font-size: 12px; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 5px; background: var(--sunk); flex: none; }
.nav-sheet[open] .nav-sheet-n { background: var(--accent); color: var(--accent-ink); }
.nav-sheet-t { flex: 1; min-width: 0; font-size: 13.5px; line-height: 1.25; }
.nav-sheet-c { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 400; }
.nav-sheet ul { list-style: none; margin: 2px 0 8px; padding: 0; }
.nav-ex { display: grid; grid-template-columns: 12px auto minmax(0, 1fr) auto; align-items: baseline; gap: 7px; padding: 4px 6px 4px 10px; border-radius: 6px; text-decoration: none; color: var(--ink); font-size: 13px; }
.nav-ex:hover { background: var(--sunk); }
.nav-ex.current { background: var(--accent-soft); }
.nav-ref { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.nav-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-empty { font-size: 12.5px; color: var(--muted); padding: 4px 10px; }
.dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--muted); align-self: center; }
.dot.tried { border-color: var(--warn); background: linear-gradient(90deg, var(--warn) 50%, transparent 50%); }
.dot.solved { border-color: var(--good); background: var(--good); }
.flagmark { color: var(--warn); font-size: 12px; }

/* main */
.view { grid-row: 3; overflow-y: auto; min-width: 0; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); min-height: 100%; }
.col { padding: 22px 24px 60px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.col-work { background: var(--surface); border-left: 1px solid var(--line); }
.single { max-width: 820px; padding: 22px 24px 60px; display: flex; flex-direction: column; gap: 16px; }
.single.wide { max-width: 980px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ex-kicker { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
.ex-kicker .sep { opacity: .5; }
.ex-head h1 { font-size: 28px; font-weight: 700; }
.ex-nav { margin-top: 12px; }
.pill { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.kind-code { color: var(--accent); border-color: var(--accent); }
.pill.status.solved { background: var(--good-soft); color: var(--good); border-color: var(--good); }
.pill.status.tried { color: var(--warn); border-color: var(--warn); }
.pill.diff { letter-spacing: 1px; }
.prose { max-width: 68ch; }
.prose p { margin: 0 0 10px; } .prose p:last-child { margin-bottom: 0; }
.prose ul { margin: 0 0 10px; padding-left: 20px; }
.prose code, .part-label code, .hint-list code, .pred-why code, .ideas code { background: var(--sunk); padding: 1px 5px; border-radius: 4px; white-space: pre-wrap; }
pre.hs, .errbox pre, .play-out, .stdout pre { margin: 0 0 10px; padding: 11px 13px; background: var(--sunk); border-radius: 7px; overflow-x: auto; line-height: 1.5; font-size: 13px; }
pre.hs code { background: none; padding: 0; white-space: pre; }
.panel { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: var(--surface); }
.col-work .panel { background: var(--bg); }
.panel h3 { font-size: 15px; margin-bottom: 8px; }
.panel h4 { font-size: 13.5px; margin: 12px 0 6px; }
.hint-list { margin: 0 0 10px; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.hint-list p { margin: 0; }
.notes { border-top: 1px dashed var(--line); margin: 12px 0 10px; }

/* buttons and fields */
.btn { font: inherit; font-weight: 500; font-size: 14px; padding: 6px 13px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 7px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); }
.btn.small { font-size: 13px; padding: 4px 10px; }
.btn:disabled { opacity: .55; cursor: default; }
.btn[aria-pressed="true"] { color: var(--warn); border-color: var(--warn); }
kbd { font-size: 11px; padding: 0 5px; border-radius: 4px; border: 1px solid currentColor; opacity: .75; }
button.link { font: inherit; background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; }
input[type="text"], select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; }
input[type="text"]:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.lab { font-size: 12.5px; color: var(--muted); } .lab.block { display: block; }
.check { display: inline-flex; align-items: center; gap: 6px; }

/* editor */
.editor { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.editor .CodeMirror { height: clamp(260px, 46vh, 520px); }
.editor.mini .CodeMirror { height: auto; min-height: 38px; }
.editor.mini .CodeMirror-scroll { min-height: 38px; max-height: 220px; }
.toolbar { margin-top: -6px; }
.testlist { font-size: 13px; }
.testlist summary { cursor: pointer; color: var(--muted); }
.testlist ul { margin: 8px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }
.testlist code { white-space: pre-wrap; word-break: break-word; }

/* results */
.results { display: flex; flex-direction: column; gap: 10px; }
.result-head { font-weight: 600; display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; border-radius: 7px; }
.result-head.good { background: var(--good-soft); color: var(--good); }
.result-head.bad { background: var(--bad-soft); color: var(--bad); }
.result-head .muted { font-weight: 400; }
.tests { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.t { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-left-width: 4px; border-radius: 7px; background: var(--surface); }
.t.pass { border-left-color: var(--good); } .t.fail, .t.exc, .t.timeout, .t.crash { border-left-color: var(--bad); } .t.notrun { opacity: .7; }
.t .mark { font-weight: 700; } .t.pass .mark { color: var(--good); } .t.fail .mark, .t.exc .mark, .t.timeout .mark, .t.crash .mark { color: var(--bad); }
.t-expr { display: block; white-space: pre-wrap; word-break: break-word; font-size: 13px; }
.t-line { display: grid; grid-template-columns: 68px minmax(0, 1fr); gap: 8px; font-size: 13px; margin-top: 2px; }
.t-line code { white-space: pre-wrap; word-break: break-word; }
.t-line.muted { display: block; }
.errbox pre { white-space: pre-wrap; word-break: break-word; border-left: 4px solid var(--bad); }
.running { display: flex; align-items: center; gap: 10px; color: var(--muted); padding: 6px 0; }
.spinner { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.stdout summary { cursor: pointer; color: var(--muted); font-size: 13px; margin-bottom: 6px; }

/* expression parts */
.part { border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 9px; background: var(--bg); }
.part.ok { border-left-color: var(--good); }
.part-label { font: 500 14.5px/1.4 var(--font-body); }
.part-out { display: flex; flex-direction: column; gap: 6px; }
.ok-note { color: var(--good); font-weight: 600; font-size: 13px; }

/* predict */
.score { font-family: var(--font-display); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
.pred-list { margin: 0; padding: 0; list-style: none; counter-reset: pred; display: flex; flex-direction: column; gap: 10px; }
.pred { counter-increment: pred; border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface); display: flex; flex-direction: column; gap: 8px; }
.pred.ok { border-left-color: var(--good); } .pred.no { border-left-color: var(--bad); }
.pred-expr { margin: 0 !important; position: relative; padding-left: 40px !important; }
.pred-expr::before { content: counter(pred, lower-alpha) ")"; position: absolute; left: 12px; color: var(--muted); }
.pred-input { font-family: var(--font-mono) !important; font-size: 13.5px !important; flex: 1 1 200px; min-width: 0; }
.pred-verdict.good { color: var(--good); font-weight: 600; } .pred-verdict.bad { color: var(--bad); }
.pred-why { font-size: 14px; color: var(--muted); }

/* proofs */
.proofbox { width: 100%; min-height: 300px; font-family: var(--font-mono) !important; font-size: 13px !important; line-height: 1.55; resize: vertical; }
.selfmark p { margin: 0 0 10px; }

/* home */
.home { max-width: 1100px; padding: 28px 24px 70px; display: flex; flex-direction: column; gap: 24px; }
.home-head h1 { font-size: 36px; }
.lede { font-size: 17px; max-width: 62ch; margin: 8px 0 14px; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
.stat-n { font-family: var(--font-display); font-weight: 700; font-size: 26px; font-variant-numeric: tabular-nums; }
.stat-l { font-size: 13px; color: var(--muted); }
.sheet-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
.sheet-card { background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 16px 18px; display: flex; flex-direction: column; gap: 9px; align-items: flex-start; }
.sheet-card > * { width: 100%; } .sheet-card > .btn { width: auto; margin-top: auto; }
.sheet-top { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sheet-n { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--orchid); }
.sheet-card h2 { font-size: 20px; }
.sheet-card p { margin: 0; font-size: 14px; }
.sheet-card summary { cursor: pointer; font-size: 13px; font-weight: 600; }
.ideas { margin: 8px 0 4px; padding-left: 18px; font-size: 13.5px; display: flex; flex-direction: column; gap: 5px; }
.about { background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 18px 20px; max-width: none; }
.about h2 { font-size: 18px; margin: 14px 0 8px; } .about h2:first-child { margin-top: 0; }
.about p, .about ul { max-width: 76ch; }

/* playground and mock */
.prompt-line { display: flex; gap: 8px; align-items: center; }
.ghci { font-family: var(--font-mono); color: var(--accent); font-weight: 600; }
.play-expr { flex: 1; min-width: 0; font-family: var(--font-mono) !important; font-size: 13.5px !important; }
.play-stdin { flex: 1 1 220px; min-width: 0; font-family: var(--font-mono) !important; font-size: 13px !important; }
.play-out { white-space: pre-wrap; word-break: break-word; }
.mock-form { display: flex; flex-direction: column; gap: 16px; }
.mock-form fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 6px; margin: 0; }
.mock-form legend { font-weight: 600; padding: 0 6px; }
.field { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; }
.tablewrap { overflow-x: auto; }
.mock-table { border-collapse: collapse; width: 100%; font-size: 14px; }
.mock-table th, .mock-table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.mock-table .num { font-variant-numeric: tabular-nums; white-space: nowrap; }

/* dialog */
.dialog { position: fixed; inset: 0; background: rgba(10, 8, 20, .5); display: grid; place-items: center; padding: 16px; z-index: 20; }
.dialog-card { background: var(--surface); border-radius: 11px; padding: 16px; width: min(720px, 100%); display: flex; flex-direction: column; gap: 10px; }
.dialog-head { display: flex; justify-content: space-between; align-items: center; }
.copybox { width: 100%; height: 50vh; font-family: var(--font-mono) !important; font-size: 12.5px !important; }

/* CodeMirror theme */
.cm-s-rev.CodeMirror { background: var(--surface); color: var(--ink); font-family: var(--font-mono); font-size: 13.5px; line-height: 1.55; }
.col-work .editor.mini .cm-s-rev.CodeMirror { background: var(--surface); }
.cm-s-rev .CodeMirror-gutters { background: var(--sunk); border-right: 1px solid var(--line); }
.cm-s-rev .CodeMirror-linenumber { color: var(--muted); }
.cm-s-rev .CodeMirror-cursor { border-left-color: var(--ink); }
.cm-s-rev .CodeMirror-selected, .cm-s-rev.CodeMirror-focused .CodeMirror-selected { background: var(--accent-soft); }
.cm-s-rev .CodeMirror-matchingbracket { color: inherit !important; background: var(--accent-soft); outline: 1px solid var(--accent); }
.cm-keyword { color: var(--code-kw); font-weight: 500; }
.cm-string, .cm-string-2 { color: var(--code-str); }
.cm-number, .cm-atom { color: var(--code-num); }
.cm-comment { color: var(--code-com); font-style: italic; }
.cm-variable-2, .cm-type { color: var(--code-type); font-weight: 600; }
.cm-builtin { color: var(--code-kw); }
.cm-variable, .cm-def { color: inherit; }
.cm-error { color: var(--bad); }


/* whole-sheet view and save indicator */
.sheetpage { max-width: 900px; padding: 24px 24px 70px; display: flex; flex-direction: column; gap: 16px; }
.sheet-q { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 12px; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
.sheet-q.solved { border-left-color: var(--good); } .sheet-q.tried { border-left-color: var(--warn); }
.sheet-q h2 { font-size: 19px; }
.sheet-q h2 a { color: inherit; text-decoration: none; } .sheet-q h2 a:hover { color: var(--accent); }
.nav-whole { display: block; padding: 4px 6px 4px 10px; font-size: 13px; font-weight: 700; text-decoration: none; border-radius: 6px; }
.nav-whole:hover, .nav-whole.current { background: var(--accent-soft); }
.ex-kicker a { color: inherit; }
.savestate { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.savestate.warn { color: var(--warn); }
.sheet-card .row { margin-top: auto; }
.nav-toggle { display: none; }
@media (max-width: 1080px) {
  .split { grid-template-columns: minmax(0, 1fr); }
  .col-work { border-left: 0; border-top: 1px solid var(--line); }
  .col { padding: 18px 16px 30px; }
}
@media (max-width: 820px) {
  body { grid-template-columns: minmax(0, 1fr); }
  .nav-toggle { display: inline-flex; }
  .side { display: none; grid-column: 1; }
  body.nav-open .side { display: block; }
  body.nav-open .view { display: none; }
  .view { grid-column: 1; }
  .top-links a { padding: 5px 7px; }
  .home, .single { padding-left: 16px; padding-right: 16px; }
  .home-head h1 { font-size: 28px; }
  .progress .bar { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
